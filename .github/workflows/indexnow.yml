name: Retry IndexNow submission

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-design-production
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/ping-indexnow.mjs --all --wait-for-commit
